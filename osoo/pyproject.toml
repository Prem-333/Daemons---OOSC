[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "agent-reliability-engine"
version = "0.1.0"
description = "LangGraph-based CI-style reliability evaluation for AI agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langchain-core>=0.3",
  "langgraph>=0.2",
  "pydantic>=2.7",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
gemini = ["langchain-google-genai>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
agent-reliability-demo = "reliability_engine.demo:main"
agent-reliability-api = "reliability_api.main:run"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["sample_agent"]

[tool.setuptools.packages.find]
where = ["src"]
